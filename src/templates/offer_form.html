{% extends "base.html" %}
{% block title %}{{ title }} — GoSolo{% endblock %}
{% block content %}
<div class="auth-card">
<h1>{{ title }}</h1>
{% for e in errors %}<p class="error">{{ e }}</p>{% endfor %}
<form method="post" class="form">
  <label>Miasto wyjazdu
    <input name="origin" placeholder="np. Warszawa" value="{{ offer.origin or '' }}" required>
  </label>
  <label>Miasto docelowe
    <input name="destination" placeholder="np. Rzym" value="{{ offer.destination or '' }}" required>
  </label>
  <label>Kraj docelowy
    <input name="country" list="countries" placeholder="np. Włochy" value="{{ offer.country or '' }}" required>
  </label>
  <datalist id="countries">{% for country in countries %}<option value="{{ country }}">{% endfor %}</datalist>
  <label>Data wyjazdu
    <input class="smart-date" type="{{ 'date' if offer.start_date else 'text' }}"
           name="start_date" placeholder="Wybierz datę" value="{{ offer.start_date or '' }}" required>
  </label>
  <label>Data powrotu
    <input class="smart-date" type="{{ 'date' if offer.end_date else 'text' }}"
           name="end_date" placeholder="Wybierz datę" value="{{ offer.end_date or '' }}" required>
  </label>
  <label>Cena za osobę (zł)
    <input type="number" name="price" min="0.01" step="0.01" value="{{ offer.price or '' }}" required>
  </label>
  <label>Limit miejsc
    <input type="number" name="seats" min="1" step="1" value="{{ offer.seats or '' }}" required>
  </label>
  <label>Typ wyjazdu
    <select name="trip_type">
      {% for t in trip_types %}
        <option value="{{ t }}" {% if offer.trip_type == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="actions">
    <button type="submit">Zapisz</button>
    <a class="link-muted" href="{{ url_for('admin') }}">Anuluj</a>
  </div>
</form>
</div>
{% endblock %}
