{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% for e in errors %}<p class="error">{{ e }}</p>{% endfor %}
<form method="post" class="form">
  <label>Kierunek <input name="destination" value="{{ offer.destination or '' }}"></label>
  <label>Data wyjazdu <input type="date" name="start_date" value="{{ offer.start_date or '' }}"></label>
  <label>Data powrotu <input type="date" name="end_date" value="{{ offer.end_date or '' }}"></label>
  <label>Cena za osobę (zł) <input name="price" value="{{ offer.price or '' }}"></label>
  <label>Limit miejsc <input name="seats" value="{{ offer.seats or '' }}"></label>
  <label>Typ wyjazdu
    <select name="trip_type">
      {% for t in trip_types %}
        <option value="{{ t }}" {% if offer.trip_type == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Zapisz</button>
  <a href="{{ url_for('admin') }}">Anuluj</a>
</form>
{% endblock %}
