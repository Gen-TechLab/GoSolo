{% extends "base.html" %}
{% block title %}Logowanie — GoSolo{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">Witaj ponownie</p>
  <h1>Logowanie</h1>
  <p class="muted">Klient podaje e-mail i hasło. Agent używa loginu <b>agent</b>.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" class="form">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label>E-mail lub login agenta
      <input name="login" autocomplete="username" required>
    </label>
    <label>Hasło
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Zaloguj</button>
  </form>

  <p class="auth-switch">Nie masz konta? <a href="{{ url_for('register') }}">Zarejestruj się</a></p>
</div>
{% endblock %}
